# /etc/apache2/sites-available/wipeout.pilou.online.conf
# Activer : sudo a2enmod headers deflate rewrite && sudo a2ensite wipeout.pilou.online && sudo systemctl reload apache2
# HTTPS   : sudo certbot --apache -d wipeout.pilou.online

<VirtualHost *:80>
    ServerName wipeout.pilou.online
    DocumentRoot /var/www/wipeout

    <Directory /var/www/wipeout>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wipeout_error.log
    CustomLog ${APACHE_LOG_DIR}/wipeout_access.log combined
</VirtualHost>
